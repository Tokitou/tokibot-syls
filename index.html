<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syllabes ratées · TokiBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0a090f;
      --bg2:       #110f1a;
      --bg3:       #1a1726;
      --border:    #2a2440;
      --violet:    #7c5cbf;
      --violet-2:  #9b7de0;
      --violet-glow: rgba(124, 92, 191, 0.18);
      --accent:    #c4a6ff;
      --text:      #e8e2f5;
      --muted:     #7a7090;
      --danger:    #e05c8a;
      --success:   #5ce0a0;
      --mono:      'DM Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── Ambient glow bg ── */
    body::after {
      content: '';
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 60vh;
      background: radial-gradient(ellipse at center, rgba(124,92,191,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--violet), var(--violet-2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--violet-glow);
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .header-text span {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--muted);
      opacity: 0.6;
    }

    /* ── Hero section ── */
    .hero {
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.5s 0.1s ease forwards;
    }

    .hero-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--violet-2);
      margin-bottom: 10px;
    }

    .player-name {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(135deg, var(--text) 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .stats-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .stat-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
      flex-shrink: 0;
    }

    .stat-pill .count {
      color: var(--accent);
      font-weight: 500;
    }

    /* ── Search bar ── */
    .search-wrap {
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.5s 0.2s ease forwards;
    }

    .search-wrap input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 3px var(--violet-glow);
    }

    .search-wrap input::placeholder { color: var(--muted); }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      opacity: 0;
      animation: fadeUp 0.5s 0.3s ease forwards;
    }

    .syl-card {
      position: relative;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 10px;
      text-align: center;
      cursor: default;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
      overflow: hidden;
    }

    .syl-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 60%, rgba(124,92,191,0.08));
      pointer-events: none;
    }

    .syl-card:hover {
      border-color: var(--violet);
      background: var(--bg3);
      transform: translateY(-2px);
    }

    .syl-card .syl-text {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text);
      text-transform: uppercase;
    }

    .syl-card .syl-len {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .syl-card.hidden { display: none; }

    /* ── Empty / error states ── */
    .state-box {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.8;
    }

    .state-box .icon {
      font-size: 36px;
      margin-bottom: 16px;
      display: block;
      opacity: 0.5;
    }

    .state-box strong {
      display: block;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 8px;
      font-family: var(--sans);
      font-weight: 700;
    }

    /* ── No results ── */
    #no-results {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      opacity: 0;
      animation: fadeUp 0.5s 0.4s ease forwards;
    }

    .footer-brand {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .footer-brand strong {
      color: var(--violet-2);
    }

    .footer-link {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-link:hover { color: var(--accent); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    .syl-card {
      opacity: 0;
      animation: fadeUp 0.3s ease forwards;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .page { padding: 32px 16px 60px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
      .syl-card .syl-text { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="header">
      <div class="logo">💣</div>
      <div class="header-text">
        <h1>TokiBot · BombParty</h1>
        <span>Rapport de fin de partie</span>
      </div>
    </div>

    <div id="main-content">
      <!-- Rempli dynamiquement -->
    </div>

    <div class="footer">
      <span class="footer-brand">Propulsé par <strong>TokiBot</strong></span>
      <a class="footer-link" href="https://jklm.fun" target="_blank" rel="noopener">jklm.fun ↗</a>
    </div>

  </div>

  <script>
    (function () {
      const params  = new URLSearchParams(window.location.search);
      const rawNick = params.get('n') || '';
      const rawSyls = params.get('s') || '';

      const nick = decodeURIComponent(rawNick).trim();
      const syls = rawSyls
        ? decodeURIComponent(rawSyls).split(',').map(s => s.trim().toUpperCase()).filter(Boolean)
        : [];

      const container = document.getElementById('main-content');

      /* ── Cas : pas de données ── */
      if (!nick && syls.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <span class="icon">🔍</span>
            <strong>Aucune donnée</strong>
            Ce lien ne contient pas de syllabes à afficher.<br>
            Il est généré automatiquement par TokiBot à la fin d'une partie.
          </div>`;
        return;
      }

      /* ── Hero ── */
      const heroHTML = `
        <div class="hero">
          <p class="hero-label">Récapitulatif · Syllabes ratées</p>
          <h2 class="player-name">${escapeHtml(nick || 'Joueur inconnu')}</h2>
          <div class="stats-row">
            <div class="stat-pill">
              <span class="dot"></span>
              <span class="count">${syls.length}</span>
              <span>syllabe${syls.length > 1 ? 's' : ''} ratée${syls.length > 1 ? 's' : ''}</span>
            </div>
          </div>
        </div>`;

      /* ── Barre de recherche + grille ── */
      const searchHTML = `
        <div class="search-wrap">
          <input id="search-input" type="text" placeholder="Filtrer les syllabes…" autocomplete="off" spellcheck="false" />
        </div>`;

      const cardsHTML = syls.map((syl, i) => `
        <div class="syl-card" data-syl="${escapeHtml(syl)}" style="animation-delay:${Math.min(i * 30, 600)}ms">
          <div class="syl-text">${escapeHtml(syl)}</div>
          <div class="syl-len">${syl.length} lettre${syl.length > 1 ? 's' : ''}</div>
        </div>`).join('');

      const gridHTML = `
        <div class="grid" id="syl-grid">
          ${cardsHTML}
          <div id="no-results">Aucune syllabe ne correspond.</div>
        </div>`;

      container.innerHTML = heroHTML + searchHTML + gridHTML;

      /* ── Filtrage ── */
      const input    = document.getElementById('search-input');
      const grid     = document.getElementById('syl-grid');
      const noResult = document.getElementById('no-results');
      const cards    = grid.querySelectorAll('.syl-card[data-syl]');

      input.addEventListener('input', () => {
        const q = input.value.trim().toUpperCase();
        let visible = 0;
        cards.forEach(card => {
          const match = !q || card.dataset.syl.includes(q);
          card.classList.toggle('hidden', !match);
          if (match) visible++;
        });
        noResult.style.display = visible === 0 ? 'block' : 'none';
      });

      function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
    })();

    /* escapeHtml doit aussi être accessible hors IIFE pour le template */
    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
