<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syllabes ratées · TokiBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:     #07060f;
      --bg2:    #0d0b1a;
      --vi:     #8a6fd4;
      --vi2:    #b49ee8;
      --vi3:    #d4c4ff;
      --text:   #e8e2ff;
      --muted:  #524b6e;
      --border: #1c1830;
      --mono:   'DM Mono', monospace;
      --serif:  'Playfair Display', serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Ligne verticale décorative (style katherine-le) ── */
    .vline {
      position: fixed;
      top: 0; bottom: 0;
      width: 1px;
      background: var(--border);
      pointer-events: none;
      z-index: 0;
    }
    .vline-1 { left: 220px; }
    .vline-2 { right: 220px; }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 40px 120px;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
      opacity: 0;
      animation: fadeUp .6s .05s ease forwards;
    }

    .nav-brand {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-lang {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 3px;
    }

    /* ── Hero — typographie monumentale ── */
    .hero {
      padding: 80px 0 64px;
      border-bottom: 1px solid var(--border);
      opacity: 0;
      animation: fadeUp .7s .15s ease forwards;
    }

    .hero-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .hero-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .hero-name {
      font-family: var(--serif);
      font-size: clamp(72px, 12vw, 140px);
      font-weight: 900;
      line-height: .92;
      letter-spacing: -.02em;
      color: var(--text);
      margin-bottom: 40px;
    }

    /* Accent italique sur une partie du nom */
    .hero-name em {
      font-style: italic;
      color: var(--vi2);
    }

    .hero-meta {
      display: flex;
      align-items: baseline;
      gap: 40px;
      flex-wrap: wrap;
    }

    .hero-count {
      font-family: var(--serif);
      font-size: 48px;
      font-weight: 400;
      font-style: italic;
      color: var(--vi2);
      line-height: 1;
    }

    .hero-count-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    .hero-hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .06em;
      align-self: flex-end;
      padding-bottom: 4px;
    }

    /* ── Search ── */
    .search-row {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 0;
      opacity: 0;
      animation: fadeUp .6s .25s ease forwards;
    }

    .search-row label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 20px 24px 20px 0;
      white-space: nowrap;
      border-right: 1px solid var(--border);
      margin-right: 24px;
    }

    .search-row input {
      flex: 1;
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: .08em;
      color: var(--text);
      outline: none;
      padding: 20px 0;
    }
    .search-row input::placeholder { color: var(--muted); }

    /* ── Grid syllabe ── */
    .grid-section {
      padding-top: 0;
      opacity: 0;
      animation: fadeUp .6s .32s ease forwards;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
    }

    /* ── Syllabe card — style grille éditoriale ── */
    .syl-card {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 28px 20px 24px;
      cursor: pointer;
      transition: background .12s;
      user-select: none;
      opacity: 0;
      animation: fadeIn .3s ease forwards;
      position: relative;
    }

    .syl-card:hover {
      background: var(--bg2);
    }

    .syl-card.active {
      background: var(--bg2);
    }
    .syl-card.active::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--vi);
    }

    .syl-card.hidden { display: none; }

    .syl-text {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--text);
      display: block;
      margin-bottom: 10px;
    }

    .syl-len {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Panel mots ── */
    #words-panel {
      display: none;
      border-bottom: 1px solid var(--border);
    }

    .words-panel-inner {
      padding: 40px 0;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 0 48px;
      align-items: start;
    }

    .words-panel-meta {
      border-right: 1px solid var(--border);
      padding-right: 48px;
    }

    .words-panel-tag {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .words-panel-syl {
      font-family: var(--serif);
      font-size: 48px;
      font-weight: 700;
      font-style: italic;
      color: var(--vi2);
      line-height: 1;
      margin-bottom: 24px;
    }

    .words-panel-close {
      background: none;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      padding: 6px 14px;
      transition: color .15s, border-color .15s;
      display: inline-block;
    }
    .words-panel-close:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .words-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: start;
    }

    .word-chip {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      letter-spacing: .04em;
      transition: border-color .12s;
    }
    .word-chip:hover { border-color: var(--muted); }

    .word-chip .hl {
      color: var(--vi2);
      font-weight: 500;
    }

    /* shimmer */
    .shimmer { display: flex; gap: 8px; flex-wrap: wrap; }
    .shimmer-chip {
      height: 34px;
      background: linear-gradient(90deg, var(--bg2) 25%, var(--border) 50%, var(--bg2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── No results ── */
    .no-results {
      display: none;
      padding: 48px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      grid-column: 1/-1;
      letter-spacing: .06em;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    /* ── Empty state ── */
    .empty-state {
      padding: 120px 0;
      border-top: 1px solid var(--border);
    }
    .empty-state p {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .1em;
      margin-bottom: 8px;
    }
    .empty-state strong {
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 400;
      font-style: italic;
      color: var(--text);
      display: block;
      margin-bottom: 16px;
    }

    /* ── Footer ── */
    footer {
      margin-top: 80px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      animation: fadeUp .6s .4s ease forwards;
    }

    .footer-l {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .1em;
    }
    .footer-l strong { color: var(--vi2); }

    footer a {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: .1em;
      transition: color .15s;
    }
    footer a:hover { color: var(--text); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .vline { display: none; }
      .page { padding: 0 20px 80px; }
      .hero-name { font-size: clamp(52px, 14vw, 80px); }
      .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .words-panel-inner { grid-template-columns: 1fr; }
      .words-panel-meta { border-right: none; border-bottom: 1px solid var(--border); padding-right: 0; padding-bottom: 24px; margin-bottom: 24px; }
    }
  </style>
</head>
<body>

<!-- Lignes verticales décoratives -->
<div class="vline vline-1"></div>
<div class="vline vline-2"></div>

<div class="page">

  <nav>
    <span class="nav-brand">TokiBot · BombParty</span>
    <div class="nav-right">
      <span class="nav-lang" id="lang-badge">FR</span>
    </div>
  </nav>

  <div id="root"></div>

  <footer>
    <span class="footer-l">Propulsé par <strong>TokiBot</strong></span>
    <a href="https://jklm.fun" target="_blank" rel="noopener">jklm.fun ↗</a>
  </footer>

</div>

<script>
(function () {
  const params   = new URLSearchParams(window.location.search);
  const nick     = decodeURIComponent(params.get('n') || '').trim();
  const lang     = (params.get('lang') || 'fr').toLowerCase();
  const rawS     = params.get('s') || '';
  // apibase permet de pointer vers le dict server local exposé publiquement
  // ex: ?apibase=http://monserveur:7777
  // Si absent, fallback sur l'API Anthropic (nécessite une clé exposée publiquement — non recommandé)
  const apiBase  = (params.get('apibase') || '').replace(/\/$/, '');
  const syls     = rawS
    ? decodeURIComponent(rawS).split(',').map(s => s.trim().toUpperCase()).filter(Boolean)
    : [];

  document.getElementById('lang-badge').textContent = lang.toUpperCase();

  const root = document.getElementById('root');

  /* ── Empty state ── */
  if (!nick && syls.length === 0) {
    root.innerHTML = `
      <div class="empty-state">
        <p>Aucune donnée</p>
        <strong>Ce lien est généré automatiquement<br>par TokiBot en fin de partie.</strong>
      </div>`;
    return;
  }

  /* ── Render hero + grille ── */
  // Découpe le pseudo : dernière lettre en italique (effet editorial)
  const nameParts = nick.length > 1
    ? `${esc(nick.slice(0, -1))}<em>${esc(nick.slice(-1))}</em>`
    : `<em>${esc(nick)}</em>`;

  root.innerHTML = `
    <div class="hero">
      <p class="hero-label">Récapitulatif · Syllabes ratées</p>
      <h1 class="hero-name">${nameParts}</h1>
      <div class="hero-meta">
        <div>
          <div class="hero-count">${syls.length}</div>
          <div class="hero-count-label">syllabe${syls.length > 1 ? 's' : ''} ratée${syls.length > 1 ? 's' : ''}</div>
        </div>
        <span class="hero-hint">↓ Cliquer sur une syllabe pour voir des mots</span>
      </div>
    </div>

    <div class="search-row">
      <label for="search">Filtrer</label>
      <input id="search" type="text" placeholder="Taper une syllabe…" autocomplete="off" spellcheck="false" />
    </div>

    <div class="grid-section">
      <div class="grid" id="grid">
        ${syls.map((s, i) => `
          <div class="syl-card" data-syl="${esc(s)}" style="animation-delay:${Math.min(i * 30, 600)}ms" tabindex="0">
            <span class="syl-text">${esc(s)}</span>
            <span class="syl-len">${s.length} lettre${s.length > 1 ? 's' : ''}</span>
          </div>`).join('')}
        <div class="no-results" id="no-results">Aucun résultat.</div>
      </div>

      <div id="words-panel">
        <div class="words-panel-inner">
          <div class="words-panel-meta">
            <div class="words-panel-tag">Mots contenant</div>
            <div class="words-panel-syl" id="panel-syl"></div>
            <button class="words-panel-close" id="close-panel">Fermer ✕</button>
          </div>
          <div id="panel-body"></div>
        </div>
      </div>
    </div>`;

  /* ── State ── */
  let activeCard = null;
  const wordCache = {};

  /* ── Search ── */
  const input     = document.getElementById('search');
  const noResults = document.getElementById('no-results');
  const cards     = () => document.querySelectorAll('.syl-card');

  input.addEventListener('input', () => {
    const q = input.value.trim().toUpperCase();
    let vis = 0;
    cards().forEach(c => {
      const show = !q || c.dataset.syl.includes(q);
      c.classList.toggle('hidden', !show);
      if (show) vis++;
    });
    noResults.style.display = vis === 0 ? 'block' : 'none';
  });

  /* ── Card click ── */
  document.getElementById('grid').addEventListener('click', e => {
    const card = e.target.closest('.syl-card');
    if (!card) return;
    const syl = card.dataset.syl;
    if (activeCard === card && document.getElementById('words-panel').style.display !== 'none') {
      closePanel(); return;
    }
    selectCard(card, syl);
  });

  document.getElementById('close-panel').addEventListener('click', closePanel);

  function selectCard(card, syl) {
    cards().forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    activeCard = card;
    showPanel(syl);
  }

  function closePanel() {
    document.getElementById('words-panel').style.display = 'none';
    cards().forEach(c => c.classList.remove('active'));
    activeCard = null;
  }

  async function showPanel(syl) {
    const panel  = document.getElementById('words-panel');
    const sylEl  = document.getElementById('panel-syl');
    const body   = document.getElementById('panel-body');

    panel.style.display = 'block';
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    sylEl.textContent = syl;

    if (wordCache[syl]) { renderWords(body, syl, wordCache[syl]); return; }

    body.innerHTML = `<div class="shimmer">
      ${[90,60,110,75,95,65,80].map(w => `<div class="shimmer-chip" style="width:${w}px"></div>`).join('')}
    </div>`;

    try {
      const words = await fetchWords(syl, lang);
      wordCache[syl] = words;
      renderWords(body, syl, words);
    } catch (err) {
      body.innerHTML = `<span style="font-size:11px;color:var(--muted);letter-spacing:.06em">Impossible de charger les mots.</span>`;
    }
  }

  function renderWords(container, syl, words) {
    if (!words || words.length === 0) {
      container.innerHTML = `<span style="font-size:11px;color:var(--muted);letter-spacing:.06em">Aucun mot trouvé.</span>`;
      return;
    }
    const re = new RegExp(`(${esc(syl)})`, 'gi');
    container.innerHTML = `<div class="words-list">${
      words.map(w => {
        const hi = esc(w).replace(re, '<span class="hl">$1</span>');
        return `<span class="word-chip">${hi}</span>`;
      }).join('')
    }</div>`;
  }

  /* ── Fetch words ──
   * Stratégie :
   *  1. Si ?apibase=http://monserveur:7777 → appelle /search du dict server local (dictionnaire réel)
   *  2. Sinon → appelle l'API Anthropic via le proxy Claude intégré (pas de clé requise)
   */
  async function fetchWords(syl, lang) {
    if (apiBase) {
      // ── Dict server local ──────────────────────────────────────────────
      const url  = `${apiBase}/search?syl=${encodeURIComponent(syl.toLowerCase())}&lang=${encodeURIComponent(lang)}&limit=15`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      return data.words || [];
    } else {
      // ── Fallback : API Anthropic via proxy (claude.ai artifacts) ──────
      const langNames = { fr: 'français', en: 'anglais', de: 'allemand', es: 'espagnol', it: 'italien' };
      const langName  = langNames[lang] || 'français';

      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model:      'claude-sonnet-4-20250514',
          max_tokens: 300,
          system:     'Tu es un assistant lexical. Réponds UNIQUEMENT avec un JSON valide, sans markdown. Format: {"words":["mot1","mot2","mot3","mot4","mot5"]}',
          messages: [{
            role:    'user',
            content: `Donne exactement 5 mots courants en ${langName} contenant la syllabe "${syl.toLowerCase()}". Sans tiret ni espace. JSON strict.`
          }]
        })
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data  = await resp.json();
      const text  = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      const clean = text.replace(/```json|```/g, '').trim();
      return JSON.parse(clean).words || [];
    }
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>
</body>
</html>
