<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syllabes ratées · TokiBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:    #08070f;
      --bg1:   #0e0c1c;
      --line:  #1c1930;
      --vi:    #7c5cbf;
      --vi2:   #a888e8;
      --text:  #ddd8f5;
      --muted: #4a4468;
      --f:     'DM Mono', monospace;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { background:var(--bg); color:var(--text); font-family:var(--f); min-height:100vh; -webkit-font-smoothing:antialiased; }

    .w { width:760px; margin:0 auto; padding-bottom:100px; }

    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:28px 0; border-bottom:1px solid var(--line);
      opacity:0; animation:up .5s ease forwards;
    }
    .h-brand { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
    .h-lang  { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); padding:4px 10px; }

    /* Hero */
    .hero {
      padding:56px 0 44px; border-bottom:1px solid var(--line);
      opacity:0; animation:up .5s .08s ease forwards;
    }
    .hero-nick { font-size:80px; font-weight:500; letter-spacing:-.03em; line-height:1; margin-bottom:28px; }
    .hero-meta { display:flex; align-items:baseline; gap:40px; }
    .hero-count { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .hero-count em { display:block; font-size:36px; font-weight:300; font-style:italic; letter-spacing:-.02em; color:var(--vi2); margin-bottom:4px; }
    .hero-hint { font-size:11px; letter-spacing:.06em; color:var(--muted); }

    /* Search */
    .search {
      border-bottom:1px solid var(--line);
      opacity:0; animation:up .5s .14s ease forwards;
    }
    .search input {
      width:100%; background:none; border:none; outline:none;
      font-family:var(--f); font-size:13px; letter-spacing:.06em;
      color:var(--text); padding:18px 0;
    }
    .search input::placeholder { color:var(--muted); }

    /* Grid */
    .grid-wrap { opacity:0; animation:up .5s .2s ease forwards; }
    .grid {
      display:grid; grid-template-columns:repeat(5,1fr);
      border-left:1px solid var(--line); border-top:1px solid var(--line);
    }
    .syl-card {
      border-right:1px solid var(--line); border-bottom:1px solid var(--line);
      padding:22px 18px; cursor:pointer; user-select:none;
      transition:background .1s; position:relative;
      opacity:0; animation:fi .3s ease forwards;
    }
    .syl-card:hover { background:var(--bg1); }
    .syl-card.active { background:var(--bg1); }
    .syl-card.active::after {
      content:''; position:absolute; bottom:0; left:0; right:0;
      height:2px; background:var(--vi);
    }
    .syl-card.hidden { display:none; }
    .syl-t { font-size:22px; font-weight:500; letter-spacing:.04em; display:block; margin-bottom:8px; }
    .syl-l { font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    .no-res {
      display:none; padding:32px; font-size:11px; letter-spacing:.06em; color:var(--muted);
      border-right:1px solid var(--line); border-bottom:1px solid var(--line); grid-column:1/-1;
    }

    /* Panel */
    #panel { display:none; border-bottom:1px solid var(--line); }
    .panel-in {
      padding:36px 0; display:grid;
      grid-template-columns:160px 1fr; gap:0 40px; align-items:start;
    }
    .p-left { padding-right:40px; border-right:1px solid var(--line); }
    .p-tag  { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .p-syl  { font-size:36px; font-weight:500; font-style:italic; color:var(--vi2); line-height:1; margin-bottom:24px; }
    .p-close {
      background:none; border:1px solid var(--line); cursor:pointer;
      font-family:var(--f); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--muted); padding:6px 12px; transition:color .15s, border-color .15s;
    }
    .p-close:hover { color:var(--text); border-color:var(--muted); }

    .words { display:flex; flex-wrap:wrap; gap:6px; align-content:start; }
    .word {
      font-size:12px; letter-spacing:.04em; color:var(--text);
      border:1px solid var(--line); padding:6px 12px; transition:border-color .1s;
    }
    .word:hover { border-color:var(--muted); }
    .word .hl { color:var(--vi2); font-weight:500; }

    .shimmer { display:flex; gap:6px; flex-wrap:wrap; }
    .sc { height:32px; border:1px solid var(--line); animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:.6} }

    .err { font-size:11px; letter-spacing:.06em; color:var(--muted); }

    /* Footer */
    footer {
      margin-top:64px; border-top:1px solid var(--line); padding-top:20px;
      display:flex; justify-content:space-between;
      opacity:0; animation:up .5s .28s ease forwards;
    }
    footer span, footer a { font-size:10px; letter-spacing:.1em; color:var(--muted); text-decoration:none; }
    footer strong { color:var(--vi2); font-weight:400; }
    footer a:hover { color:var(--text); }

    /* Empty */
    .empty { padding:80px 0; border-top:1px solid var(--line); }
    .empty p { font-size:11px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; margin-bottom:12px; }
    .empty strong { font-size:24px; font-weight:300; color:var(--text); display:block; }

    @keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
    @keyframes fi { from{opacity:0} to{opacity:1} }

    @media (max-width:820px) {
      .w { width:100%; padding:0 20px 80px; }
      .grid { grid-template-columns:repeat(3,1fr); }
      .hero-nick { font-size:52px; }
      .panel-in { grid-template-columns:1fr; gap:24px; }
      .p-left { border-right:none; border-bottom:1px solid var(--line); padding-right:0; padding-bottom:24px; }
    }
  </style>
</head>
<body>
<div class="w">
  <header>
    <span class="h-brand">TokiBot · BombParty</span>
    <span class="h-lang" id="lang-badge">FR</span>
  </header>
  <div id="root"></div>
  <footer>
    <span>Propulsé par <strong>TokiBot</strong></span>
    <a href="https://jklm.fun" target="_blank" rel="noopener">jklm.fun ↗</a>
  </footer>
</div>
<script>
(function(){
  const p       = new URLSearchParams(location.search);
  const nick    = decodeURIComponent(p.get('n') || '').trim();
  const lang    = (p.get('lang') || 'fr').toLowerCase();
  const apiBase = (p.get('apibase') || '').replace(/\/$/,'');
  const syls    = (p.get('s') ? decodeURIComponent(p.get('s')) : '')
    .split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);

  document.getElementById('lang-badge').textContent = lang.toUpperCase();
  const root = document.getElementById('root');

  if (!nick && !syls.length) {
    root.innerHTML = `<div class="empty"><p>Aucune donnée</p><strong>Ce lien est généré automatiquement par TokiBot en fin de partie.</strong></div>`;
    return;
  }

  root.innerHTML = `
    <div class="hero">
      <div class="hero-nick">${esc(nick||'—')}</div>
      <div class="hero-meta">
        <div class="hero-count"><em>${syls.length}</em>syllabe${syls.length>1?'s':''} ratée${syls.length>1?'s':''}</div>
        <span class="hero-hint">Cliquer sur une syllabe pour voir des mots</span>
      </div>
    </div>
    <div class="search"><input id="srch" type="text" placeholder="Filtrer…" autocomplete="off" spellcheck="false"/></div>
    <div class="grid-wrap">
      <div class="grid" id="grid">
        ${syls.map((s,i)=>`
          <div class="syl-card" data-syl="${esc(s)}" style="animation-delay:${Math.min(i*25,500)}ms">
            <span class="syl-t">${esc(s)}</span>
            <span class="syl-l">${s.length} lettre${s.length>1?'s':''}</span>
          </div>`).join('')}
        <div class="no-res" id="no-res">Aucun résultat.</div>
      </div>
      <div id="panel">
        <div class="panel-in">
          <div class="p-left">
            <div class="p-tag">Mots contenant</div>
            <div class="p-syl" id="p-syl"></div>
            <button class="p-close" id="p-close">Fermer ✕</button>
          </div>
          <div id="p-body"></div>
        </div>
      </div>
    </div>`;

  let active = null;
  const cache = {};

  document.getElementById('srch').addEventListener('input', e=>{
    const q = e.target.value.trim().toUpperCase();
    let n = 0;
    document.querySelectorAll('.syl-card').forEach(c=>{
      const ok = !q || c.dataset.syl.includes(q);
      c.classList.toggle('hidden',!ok);
      if(ok) n++;
    });
    document.getElementById('no-res').style.display = n?'none':'block';
  });

  document.getElementById('grid').addEventListener('click', e=>{
    const c = e.target.closest('.syl-card');
    if(!c) return;
    if(active===c && document.getElementById('panel').style.display!=='none'){close();return;}
    document.querySelectorAll('.syl-card').forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); active=c;
    openPanel(c.dataset.syl);
  });

  document.getElementById('p-close').addEventListener('click', close);

  function close(){
    document.getElementById('panel').style.display='none';
    document.querySelectorAll('.syl-card').forEach(x=>x.classList.remove('active'));
    active=null;
  }

  async function openPanel(syl){
    const panel = document.getElementById('panel');
    const body  = document.getElementById('p-body');
    document.getElementById('p-syl').textContent = syl;
    panel.style.display='block';
    panel.scrollIntoView({behavior:'smooth',block:'nearest'});
    if(cache[syl]){render(body,syl,cache[syl]);return;}
    body.innerHTML=`<div class="shimmer">${[80,55,100,65,90,50,75,60].map(w=>`<div class="sc" style="width:${w}px"></div>`).join('')}</div>`;
    try{
      const words = await fetchWords(syl,lang);
      cache[syl]=words;
      render(body,syl,words);
    }catch(e){
      body.innerHTML=`<span class="err">Impossible de charger les mots.</span>`;
    }
  }

  function render(el,syl,words){
    if(!words||!words.length){el.innerHTML=`<span class="err">Aucun mot trouvé.</span>`;return;}
    const re=new RegExp(`(${esc(syl)})`, 'gi');
    el.innerHTML=`<div class="words">${
      words.map(w=>`<span class="word">${esc(w).replace(re,'<span class="hl">$1</span>')}</span>`).join('')
    }</div>`;
  }

  async function fetchWords(syl,lang){
    if(!apiBase) throw new Error('apibase non défini');
    // Appelle /words sur le panel TokiBot (port 9999), qui proxifie vers le dict server (7777)
    const r = await fetch(`${apiBase}/words?syl=${encodeURIComponent(syl.toLowerCase())}&lang=${encodeURIComponent(lang)}&limit=15`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    return d.words||[];
  }

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
})();
</script>
</body>
</html>
